<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Phiếu khảo sát nhu cầu xây nhà – [TÊN CÔNG TY]</title>
<meta name="description" content="Phiếu thông tin thiết kế nhà phố, biệt thự trọn gói: phong thủy tuổi gia chủ, công năng, phong cách, ngân sách.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
body{margin:0;background:#F3F1EC;font-family:'Be Vietnam Pro',system-ui,sans-serif;color:#1B1F1D}
*{box-sizing:border-box}
a{color:#1E5A4C}a:hover{color:#123B31}
.in{width:100%;min-height:44px;padding:10px 12px;border:1px solid #CFCAC0;border-radius:8px;background:#fff;font:inherit;font-size:15px;color:#1B1F1D}
.in:focus{outline:2px solid #1E5A4C;outline-offset:1px;border-color:#1E5A4C}
textarea.in{min-height:96px;resize:vertical}
.fld{display:flex;flex-direction:column;gap:6px;min-width:0}
.lb{font-size:13px;font-weight:600;color:#3D4441}
.hint{font-size:13px;color:#5A625E;line-height:1.55;margin:0}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{min-height:44px;padding:8px 16px;border:1px solid #CFCAC0;border-radius:999px;background:#fff;font:inherit;font-size:14px;color:#1B1F1D;cursor:pointer;display:inline-flex;flex-direction:column;align-items:center;justify-content:center;line-height:1.25}
.chip:hover{border-color:#1E5A4C}
.chip.on{background:#1E5A4C;border-color:#1E5A4C;color:#fff}
.dir .chip{border-radius:10px;min-width:104px}
.sub{font-size:11.5px;color:#5A625E;margin-top:2px}
.chip.on .sub{color:#D7E8E1}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:16px}
.grid3{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:12px}
.sec{display:flex;flex-direction:column;gap:10px}
.sec-h{margin:0;font-size:15px;font-weight:700;color:#1B1F1D}
.grp{border-top:1px solid #EEEBE5;padding-top:24px;display:flex;flex-direction:column;gap:20px}
.grp-h{margin:0;font-size:13px;font-weight:700;letter-spacing:0.08em;text-transform:uppercase;color:#1E5A4C}
.box{border:1px solid #E2DED6;border-radius:12px;padding:16px;display:flex;flex-direction:column;gap:12px;background:#FBFAF7}
.stp{display:flex;align-items:center;gap:10px;padding:8px 14px 8px 8px;border:1px solid transparent;background:transparent;border-radius:999px;font:inherit;font-size:14px;cursor:pointer;color:#5A625E;min-height:44px}
.stp .n{width:28px;height:28px;border-radius:50%;border:1px solid #CFCAC0;display:inline-grid;place-items:center;font-size:13px;font-weight:600;background:#fff}
.stp.on{background:#fff;color:#1B1F1D;border-color:#DAD6CE;font-weight:600}
.stp.on .n{background:#1E5A4C;color:#fff;border-color:#1E5A4C}
.stp.done .n{background:#E3EEE9;color:#1E5A4C;border-color:#BFD8CE}
.ctr{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:8px 8px 8px 14px;border:1px solid #DAD6CE;border-radius:12px;background:#fff}
.ctr-b{width:44px;height:44px;border-radius:8px;border:1px solid #CFCAC0;background:#F7F6F2;font:inherit;font-size:20px;line-height:1;cursor:pointer;color:#1B1F1D}
.ctr-b:hover{border-color:#1E5A4C}
.stc{text-align:left;display:flex;flex-direction:column;gap:8px;padding:12px;border:1px solid #DAD6CE;border-radius:14px;background:#fff;cursor:pointer;font:inherit;color:inherit}
.stc:hover{border-color:#1E5A4C}
.stc.on{border-color:#1E5A4C;box-shadow:0 0 0 2px #1E5A4C}
.sw-row{display:flex;height:64px;border-radius:8px;overflow:hidden}
.sw{flex:1 1 0}
.card{background:#fff;border:1px solid #E2DED6;border-radius:16px;padding:24px}
.row{display:flex;justify-content:space-between;align-items:baseline;gap:16px;padding:9px 0;border-bottom:1px solid #EEEBE5;font-size:14px}
.row:last-child{border-bottom:none}
.k{color:#5A625E}
.v{font-weight:600;text-align:right}
.tag{display:inline-block;padding:3px 10px;border-radius:999px;font-size:12.5px;font-weight:600;white-space:nowrap}
.good{background:#E3EEE9;color:#1E5A4C}
.bad{background:#FBEDE2;color:#8A3F0C}
.note{padding:12px 14px;border-radius:10px;font-size:13.5px;line-height:1.55}
.btn{min-height:48px;padding:12px 24px;border-radius:10px;border:1px solid #1E5A4C;background:#1E5A4C;color:#fff;font:inherit;font-size:15px;font-weight:600;cursor:pointer}
.btn:hover{background:#174A3E}
.btn.ghost{background:#fff;color:#1E5A4C}
.btn.ghost:hover{background:#F2F7F5}
.chk{display:flex;gap:12px;align-items:flex-start;font-size:14px;line-height:1.55;cursor:pointer}
.chk input{width:20px;height:20px;margin-top:2px;accent-color:#1E5A4C;flex:none}
.file{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;min-height:120px;padding:20px;border:1.5px dashed #BFB9AD;border-radius:12px;background:#FBFAF7;text-align:center;cursor:pointer}
.file:hover{border-color:#1E5A4C}
@media (max-width:640px){.hero-h{font-size:28px !important}.main-card{padding:20px !important}}
</style>
<script>
/* ===== CẤU HÌNH: dán link Apps Script (…/exec) vào đây ===== */
window.KHAOSAT_CONFIG = { scriptUrl: '' };
</script>
</head>

<div id="app"></div>
